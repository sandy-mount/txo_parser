<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1a"/>
      <stop offset="50%" stop-color="#1a1a3e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7931a"/>
      <stop offset="100%" stop-color="#e8850f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.03" stroke="#fff" stroke-width="1">
    <line x1="0" y1="0" x2="1200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
  </g>

  <!-- TXO title -->
  <text x="100" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="96" font-weight="800" fill="#fff" letter-spacing="-2">TXO</text>

  <!-- Subtitle -->
  <text x="100" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" fill="rgba(255,255,255,0.5)">Voucher Management &amp; Bitcoin Anchoring</text>

  <!-- URI example -->
  <rect x="80" y="310" width="1040" height="60" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="110" y="350" font-family="'SF Mono', 'Fira Code', monospace" font-size="22" fill="#10b981">txo:btc:4e9c1ef9...a3b0:0?amount=50000&amp;privkey=Kx9...</text>

  <!-- Feature pills -->
  <rect x="100" y="420" width="120" height="40" rx="10" fill="url(#blue)"/>
  <text x="130" y="446" font-family="-apple-system, sans-serif" font-size="16" font-weight="600" fill="#fff">Parse</text>

  <rect x="240" y="420" width="110" height="40" rx="10" fill="url(#blue)"/>
  <text x="267" y="446" font-family="-apple-system, sans-serif" font-size="16" font-weight="600" fill="#fff">Build</text>

  <rect x="370" y="420" width="150" height="40" rx="10" fill="url(#blue)"/>
  <text x="393" y="446" font-family="-apple-system, sans-serif" font-size="16" font-weight="600" fill="#fff">Vouchers</text>

  <rect x="540" y="420" width="130" height="40" rx="10" fill="url(#blue)"/>
  <text x="567" y="446" font-family="-apple-system, sans-serif" font-size="16" font-weight="600" fill="#fff">Faucet</text>

  <rect x="690" y="420" width="170" height="40" rx="10" fill="url(#orange)"/>
  <text x="710" y="446" font-family="-apple-system, sans-serif" font-size="16" font-weight="600" fill="#000">Blocktrails</text>

  <rect x="880" y="420" width="130" height="40" rx="10" fill="url(#blue)"/>
  <text x="907" y="446" font-family="-apple-system, sans-serif" font-size="16" font-weight="600" fill="#fff">Ledger</text>

  <!-- Footer -->
  <text x="100" y="560" font-family="-apple-system, sans-serif" font-size="18" fill="rgba(255,255,255,0.2)">Powered by LOSOS · did:nostr · Testnet4</text>

  <!-- Bitcoin symbol accent -->
  <circle cx="1080" cy="180" r="60" fill="none" stroke="url(#orange)" stroke-width="3" opacity="0.3"/>
  <text x="1058" y="200" font-family="-apple-system, sans-serif" font-size="48" font-weight="700" fill="#f7931a" opacity="0.4">₿</text>
</svg>
